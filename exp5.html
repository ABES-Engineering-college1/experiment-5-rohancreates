<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5th Experiment</title>
</head>
<body>




    <h1 style="text-align: center;">Student Registration Form</h1>
    <hr>
    <label for="name">Full Name:</label>
    <input type="text" placeholder="enter full name">
    <br><br>
    <label for="email">Email: </label>
    <input type="email" placeholder="enter email">
    <br><br>
    <label for="password">Password</label>
    <input type="password" placeholder="enter password">
    <br><br>
    <label for="gender">Gender</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br>
    <label for="course">Course:</label> 
    <select>
        <option >Select Course</option>

        <option value="bca">BCA</option>
        <option value="bba">BBA</option>
        <option value="btech">B.Tech</option>
        <option value="mca">MCA</option>
    </select>
    <br><br>
    <label for="contact">Contact number</label>
    <input type="text" placeholder="Enter phone number">
    <br><br>
    <label for="address">Address:</label>
    
    <br>
    <textarea rows="4" cols="50" placeholder="enter your address"></textarea>
    <br><br>
    <input type="submit" >
    <input type="reset" >
    <br><br>
    <hr>
    <p style="text-align: center;">&copy; 2025 Student Registration Portal</p>
</form>
    
</body>
</html>
